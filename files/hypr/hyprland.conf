# ~/.config/hypr/hyprland.conf
#
# Seeded once by VexOS on first Hyprland boot. Edit this freely — nixos-rebuild
# will NOT overwrite it. Delete it and rebuild to get a fresh copy of the
# VexOS default.
#
# Keybind scheme adopted from Omarchy (basecamp/omarchy, master branch —
# default/hypr/bindings/{media,clipboard,tiling-v2,utilities}.conf), adapted
# to call DMS ipc / hyprshot / already-installed tools instead of Omarchy's
# own CLI (walker, mako, swayosd, omarchy-menu, voxtype), which this project
# doesn't have. See
# .github/docs/subagent_docs/hyprland_omarchy_keybinds_spec.md for the full
# per-binding mapping and what was deliberately left out.
#
# Full reference: https://wiki.hypr.land/Configuring/
# DMS keybind cheatsheet: run `dms keybinds show hyprland`

monitor = , preferred, auto, 1

# ── Misc ───────────────────────────────────────────────────────────────────
misc {
    # VexOS launches Hyprland through UWSM (programs.hyprland.withUWSM), not the
    # start-hyprland wrapper — the two are alternative session managers. UWSM
    # execs the Hyprland binary directly, which trips Hyprland's advisory
    # "started without start-hyprland" warning on every boot. That is the
    # expected state here, so silence it.
    disable_watchdog_warning = true

    # Stock Hyprland branding would undercut the custom rice below.
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    # Fallback color shown before the wallpaper loads — matches the
    # wallpaper's own background instead of Hyprland's default black.
    background_color = 0x050a14
}

# ── VexOS Neo-Cyberpunk rice ─────────────────────────────────────────────────
# Palette extracted from wallpapers/desktop/vex-bb-{dark,light}.jxl — see
# .github/docs/subagent_docs/hyprland_neo_cyberpunk_rice_spec.md. The active
# border gradient (cyan → amber) re-creates the wallpaper's own crossing
# light-trails rather than picking an arbitrary accent color.
general {
    gaps_in  = 5
    gaps_out = 12
    border_size = 2
    col.active_border   = rgba(05f4faee) rgba(f9b62eee) 45deg
    col.inactive_border = rgba(1c2e49aa)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.2
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(050a14cc)
    }
}

animations {
    enabled = true
    # A single smooth ease-out curve, deliberately without overshoot/bounce.
    bezier = smoothDecel, 0.05, 0.9, 0.1, 1.0

    animation = windows,     1, 4, smoothDecel, slide
    animation = windowsOut,  1, 4, smoothDecel, slide
    animation = border,      1, 6, smoothDecel
    animation = fade,        1, 4, smoothDecel
    animation = workspaces,  1, 4, smoothDecel, slide
    animation = layers,      1, 4, smoothDecel, slide
}

# ── Autostart ──────────────────────────────────────────────────────────────
# The DMS shell itself is started by its systemd user service (dms.service,
# enabled via programs.dank-material-shell.systemd.enable and bound to
# graphical-session.target by UWSM). Do NOT also `exec-once = dms run` here —
# that starts a second shell instance and you get two stacked top bars.
exec-once = bash -c "wl-paste --watch cliphist store &"

# ── Variables ──────────────────────────────────────────────────────────────
$mod      = SUPER
$terminal = ghostty

# ── DankMaterialShell ──────────────────────────────────────────────────────
bind = $mod,       Space,  exec, dms ipc call spotlight toggle
bind = $mod,       V,      exec, dms ipc call clipboard toggle
bind = $mod,       N,      exec, dms ipc call notifications toggle
bind = $mod,       M,      exec, dms ipc call processlist toggle
bind = $mod,       comma,  exec, dms ipc call settings toggle
bind = $mod,       X,      exec, dms ipc call dash toggle ""
bind = $mod,       L,      exec, dms ipc call lock lock
bind = $mod CTRL,  N,      exec, dms ipc call night toggle
bind = $mod,       ESCAPE, exec, dms ipc call powermenu toggle
bind = $mod SHIFT, comma,  exec, dms ipc call notifications dismissAllPopups

# DO NOT reassign — this is the project's fixed PTT (mic-mute) binding.
bind = $mod,       backslash, exec, dms ipc call mic mute

# ── Media / brightness keys → DMS (so the on-screen display shows) ──────────
bindel = ,      XF86AudioRaiseVolume,  exec, dms ipc call audio increment 5
bindel = ,      XF86AudioLowerVolume,  exec, dms ipc call audio decrement 5
bindl  = ,      XF86AudioMute,         exec, dms ipc call audio mute
bindl  = ,      XF86AudioMicMute,      exec, dms ipc call mic mute
bindel = ,      XF86MonBrightnessUp,   exec, dms ipc call brightness increment 10
bindel = ,      XF86MonBrightnessDown, exec, dms ipc call brightness decrement 10
bind   = SHIFT, XF86MonBrightnessUp,   exec, dms ipc call brightness set 100
bind   = SHIFT, XF86MonBrightnessDown, exec, dms ipc call brightness set 1
bindel = ALT,   XF86AudioRaiseVolume,  exec, dms ipc call audio increment 1
bindel = ALT,   XF86AudioLowerVolume,  exec, dms ipc call audio decrement 1
bindel = ALT,   XF86MonBrightnessUp,   exec, dms ipc call brightness increment 1
bindel = ALT,   XF86MonBrightnessDown, exec, dms ipc call brightness decrement 1
bindl  = ,      XF86AudioPlay,         exec, playerctl play-pause
bindl  = ,      XF86AudioPause,        exec, playerctl play-pause
bindl  = ,      XF86AudioNext,         exec, playerctl next
bindl  = ,      XF86AudioPrev,         exec, playerctl previous

# ── Screenshots / colour picking (tools installed by modules/hyprland-desktop.nix) ──
# Restructured from Omarchy's PRINT cluster to fit our 3-mode hyprshot setup:
# no screen-recording tool is installed (ALT+PRINT unbound, unlike Omarchy),
# and SUPER CTRL+PRINT is repurposed from Omarchy's OCR slot (no OCR tool
# either) to keep our pre-existing window-capture mode.
bind = ,           Print,  exec, hyprshot -m region
bind = $mod,       Print,  exec, pkill hyprpicker || hyprpicker -a
bind = $mod SHIFT, Print,  exec, hyprshot -m output
bind = $mod CTRL,  Print,  exec, hyprshot -m window

# ── Window management ────────────────────────────────────────────────────────
bind = $mod,       Return, exec, $terminal
bind = $mod,       W,      killactive
bind = $mod,       E,      exec, nautilus
bind = $mod SHIFT, F,      exec, nautilus --new-window
bind = $mod,       J,      layoutmsg, togglesplit
bind = $mod,       P,      pseudo
bind = $mod,       T,      togglefloating
bind = $mod,       F,      fullscreen, 0
bind = $mod CTRL,  F,      fullscreenstate, 0 2
bind = $mod ALT,   F,      fullscreen, 1

# Focus with SUPER + arrow keys
bind = $mod,       left,  movefocus, l
bind = $mod,       right, movefocus, r
bind = $mod,       up,    movefocus, u
bind = $mod,       down,  movefocus, d

# Swap active window with SUPER + SHIFT + arrow keys
bind = $mod SHIFT, left,  swapwindow, l
bind = $mod SHIFT, right, swapwindow, r
bind = $mod SHIFT, up,    swapwindow, u
bind = $mod SHIFT, down,  swapwindow, d

# Move workspace to another monitor with SUPER + SHIFT + ALT + arrow keys
bind = $mod SHIFT ALT, left,  movecurrentworkspacetomonitor, l
bind = $mod SHIFT ALT, right, movecurrentworkspacetomonitor, r
bind = $mod SHIFT ALT, up,    movecurrentworkspacetomonitor, u
bind = $mod SHIFT ALT, down,  movecurrentworkspacetomonitor, d

# Workspaces 1-10 via physical key codes (layout-independent, matches Omarchy)
bind = $mod,       code:10, workspace, 1
bind = $mod,       code:11, workspace, 2
bind = $mod,       code:12, workspace, 3
bind = $mod,       code:13, workspace, 4
bind = $mod,       code:14, workspace, 5
bind = $mod,       code:15, workspace, 6
bind = $mod,       code:16, workspace, 7
bind = $mod,       code:17, workspace, 8
bind = $mod,       code:18, workspace, 9
bind = $mod,       code:19, workspace, 10

bind = $mod SHIFT, code:10, movetoworkspace, 1
bind = $mod SHIFT, code:11, movetoworkspace, 2
bind = $mod SHIFT, code:12, movetoworkspace, 3
bind = $mod SHIFT, code:13, movetoworkspace, 4
bind = $mod SHIFT, code:14, movetoworkspace, 5
bind = $mod SHIFT, code:15, movetoworkspace, 6
bind = $mod SHIFT, code:16, movetoworkspace, 7
bind = $mod SHIFT, code:17, movetoworkspace, 8
bind = $mod SHIFT, code:18, movetoworkspace, 9
bind = $mod SHIFT, code:19, movetoworkspace, 10

bind = $mod SHIFT ALT, code:10, movetoworkspacesilent, 1
bind = $mod SHIFT ALT, code:11, movetoworkspacesilent, 2
bind = $mod SHIFT ALT, code:12, movetoworkspacesilent, 3
bind = $mod SHIFT ALT, code:13, movetoworkspacesilent, 4
bind = $mod SHIFT ALT, code:14, movetoworkspacesilent, 5
bind = $mod SHIFT ALT, code:15, movetoworkspacesilent, 6
bind = $mod SHIFT ALT, code:16, movetoworkspacesilent, 7
bind = $mod SHIFT ALT, code:17, movetoworkspacesilent, 8
bind = $mod SHIFT ALT, code:18, movetoworkspacesilent, 9
bind = $mod SHIFT ALT, code:19, movetoworkspacesilent, 10

# Scratchpad
bind = $mod,     S, togglespecialworkspace, scratchpad
bind = $mod ALT, S, movetoworkspacesilent, special:scratchpad

# Cycle workspaces
bind = $mod,      TAB, workspace, e+1
bind = $mod SHIFT, TAB, workspace, e-1
bind = $mod CTRL,  TAB, workspace, previous
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Cycle windows on the active workspace (Alt+Tab)
bind = ALT,       TAB, cyclenext
bind = ALT,       TAB, bringactivetotop
bind = ALT SHIFT, TAB, cyclenext, prev
bind = ALT SHIFT, TAB, bringactivetotop

# Cycle monitors
bind = CTRL ALT,       TAB, focusmonitor, +1
bind = CTRL ALT SHIFT, TAB, focusmonitor, -1

# Resize active window (the "-"/"=" keys)
bind = $mod,       code:20, resizeactive, -100 0
bind = $mod,       code:21, resizeactive, 100 0
bind = $mod SHIFT, code:20, resizeactive, 0 -100
bind = $mod SHIFT, code:21, resizeactive, 0 100

# Move/resize windows with SUPER + LMB/RMB drag
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Window groups
bind = $mod,     G, togglegroup
bind = $mod ALT, G, moveoutofgroup
bind = $mod ALT, left,  moveintogroup, l
bind = $mod ALT, right, moveintogroup, r
bind = $mod ALT, up,    moveintogroup, u
bind = $mod ALT, down,  moveintogroup, d
bind = $mod ALT,       TAB, changegroupactive, f
bind = $mod ALT SHIFT, TAB, changegroupactive, b
bind = $mod CTRL, left,  changegroupactive, b
bind = $mod CTRL, right, changegroupactive, f
bind = $mod ALT, mouse_down, changegroupactive, f
bind = $mod ALT, mouse_up,   changegroupactive, b
bind = $mod ALT, code:10, changegroupactive, 1
bind = $mod ALT, code:11, changegroupactive, 2
bind = $mod ALT, code:12, changegroupactive, 3
bind = $mod ALT, code:13, changegroupactive, 4
bind = $mod ALT, code:14, changegroupactive, 5

# ── Utilities ─────────────────────────────────────────────────────────────
bind = ,           XF86Calculator, exec, gtk-launch org.gnome.Calculator

bind = $mod CTRL, A, exec, pavucontrol
bind = $mod CTRL, B, exec, blueman-manager
bind = $mod CTRL, W, exec, $terminal -e nmtui
bind = $mod CTRL, T, exec, $terminal -e btop

bind = $mod CTRL ALT, T, exec, notify-send -u low "$(date +"%A %H:%M  ·  %d %B %Y  ·  Week %V")"
bind = $mod CTRL ALT, B, exec, notify-send -u low "$(upower -i $(upower -e | grep BAT) | grep -E 'percentage|state')"

bind = $mod CTRL,     Z, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bind = $mod CTRL ALT, Z, exec, hyprctl keyword cursor:zoom_factor 1
